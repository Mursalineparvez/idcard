  function loadImageSafe(src){
    return new Promise(resolve => {
      if(!src){ resolve(null); return; }
      const img = new Image();
      let settled = false;
      const finish = result => { if(!settled){ settled = true; resolve(result); } };
      img.crossOrigin = 'anonymous';
      img.onload = () => finish(img);
      img.onerror = () => finish(null);
      img.src = src;
      setTimeout(() => finish(null), 6000);
    });
  }

  function roundedRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }


  async function buildSharePng(p){
    if(document.fonts && document.fonts.ready){ try { await document.fonts.ready; } catch(e){} }

    const hist = sortedHistory(p);
    const GROUP_COLOR = {
      coordinators: { main: '#0E8074', soft: 'rgba(14,128,116,0.12)' },
      core_team:    { main: '#C08A2E', soft: 'rgba(192,138,46,0.12)' },
      volunteers:   { main: '#6F63B8', soft: 'rgba(111,99,184,0.12)' },
      executives:   { main: '#0E8074', soft: 'rgba(14,128,116,0.12)' }
    };
    const GROUP_LABEL = { coordinators: 'Coordinator', core_team: 'Core Team', volunteers: 'Volunteer & Mentor', executives: 'Executive' };

    function maskPhone(phone){
      const digits = String(phone).replace(/[^0-9]/g, '');
      if(digits.length <= 3) return phone;
      return digits.slice(0, -3) + '***';
    }
    function districtOnly(address){
      if(!address) return '';
      const explicit = address.match(/Dis(?:trict)?:\s*([^,]+)/i);
      if(explicit) return explicit[1].trim().replace(/\.$/, '');
      const parts = address.split(',').map(s => s.trim()).filter(Boolean);
      let last = parts[parts.length - 1] || address.trim();
      last = last.replace(/-?\s*\d{3,4}$/, '').replace(/\.$/, '').trim();
      return last;
    }
    const instText = [p.institution, p.department].filter(Boolean).join(' — ');
    const presentDistrict = districtOnly(p.presentAddress);
    const permanentDistrict = districtOnly(p.permanentAddress);
    const addressText = presentDistrict
      ? `${presentDistrict}${permanentDistrict && permanentDistrict !== presentDistrict ? ` (Permanent: ${permanentDistrict})` : ''}`
      : (permanentDistrict || '');

    const infoRows = [];
    const ORG_LABEL_NAMES = ['Munir Hasan', 'Farseem Mannan Mohammady', 'Mahmud Mim'];
    const instLabel = ORG_LABEL_NAMES.includes(p.name) ? 'Organization' : 'Institution';
    if(instText) infoRows.push(['🎓', instLabel, instText]);
    if(p.phone) infoRows.push(['📞', 'Phone', maskPhone(p.phone)]);
    if(p.email) infoRows.push(['✉️', 'Email', p.email]);
    if(addressText) infoRows.push(['📍', 'Location', addressText]);

    // Wraps text onto as many lines as needed to fit maxWidth — used so
    // long institution names / names never get cut off with an ellipsis,
    // they just take the extra line(s) they need.
    function wrapTextLines(mctx, text, maxWidth){
      const words = String(text).split(/\s+/).filter(Boolean);
      const lines = [];
      let current = '';
      words.forEach(word => {
        const test = current ? current + ' ' + word : word;
        if(current && mctx.measureText(test).width > maxWidth){
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      });
      if(current) lines.push(current);
      return lines.length ? lines : [''];
    }

    // A throwaway canvas just for text measurement, so we can figure out
    // exactly how tall the real canvas needs to be BEFORE creating it
    // (canvas dimensions can't change after drawing starts).
    const mctx = document.createElement('canvas').getContext('2d');

    // ---- Name: shrink to fit one line first; only wrap to a second
    // line if it's still too wide even at the smallest readable size ----
    const CW = 1000; // inner content width
    const maxNameWidth = CW - 160;
    let nameFontSize = 50;
    mctx.font = `700 ${nameFontSize}px 'Fraunces', serif`;
    while(nameFontSize > 30 && mctx.measureText(p.name).width > maxNameWidth){
      nameFontSize -= 2;
      mctx.font = `700 ${nameFontSize}px 'Fraunces', serif`;
    }
    const nameLines = mctx.measureText(p.name).width > maxNameWidth
      ? wrapTextLines(mctx, p.name, maxNameWidth)
      : [p.name];
    const nameLineH = nameFontSize * 1.12;
    const nameExtra = (nameLines.length - 1) * nameLineH;

    // ---- Info rows: wrap each value fully (no truncation) and give
    // each row exactly the height its wrapped text needs ----
    const infoCardX = 70, infoCardW = CW - 140;
    const valueMaxWidth = infoCardW - 96 - 40;
    mctx.font = "600 25px 'Manrope', sans-serif";
    const rowLabelH = 30, rowLineH = 34, rowBottomPad = 26;
    const infoRowsWrapped = infoRows.map(([emoji, label, value]) => {
      const lines = wrapTextLines(mctx, value, valueMaxWidth);
      const rowHeight = rowLabelH + lines.length*rowLineH + rowBottomPad;
      return { emoji, label, lines, rowHeight };
    });

    // ---- Layout math (canvas height is computed from real content so
    // nothing gets cut off or leaves dead space, regardless of how much
    // history/contact info this particular person has) ----
    // Photo box dimensions declared here (used again down in the actual
    // drawing code) so the header-height math and the real layout can
    // never drift apart when this gets resized.
    const PHOTO_AREA_Y = 150, PHOTO_AREA_H = 700;
    const headerH = (PHOTO_AREA_Y + PHOTO_AREA_H) + 50;
    const infoCardPad = 44;
    const infoRowsTotalH = infoRowsWrapped.reduce((sum, r) => sum + r.rowHeight, 0);
    const infoCardH = infoRows.length ? (infoCardPad*2 + infoRowsTotalH - rowBottomPad) : 0;
    const infoCardY = headerH;
    const histCardPad = 40;
    const histHeaderH = 74;
    const histRowH = 78;
    const SINGLE_COL_NAMES = ['Rezaul Islam', 'Farseem Mannan Mohammady'];
    const histCols = (hist.length > 1 && !SINGLE_COL_NAMES.includes(p.name)) ? 2 : 1;
    const histRowsPerCol = Math.ceil(hist.length / histCols);
    const histCardH = histCardPad*2 + histHeaderH + histRowsPerCol*histRowH - 16;
    const histSectionY = infoCardY + infoCardH + (infoRows.length ? 34 : 26);
    const footerH = 150;
    const CH = histSectionY + histCardH + 34 + footerH; // inner content height

    const M = 46; // outer margin / frame thickness
    const W = CW + M*2, H = CH + M*2;

    const canvas = document.createElement('canvas');
    // Export at 3x resolution so the downloaded PNG stays crisp even
    // when opened full-size or printed — the canvas pixel grid is 3x
    // the layout's logical size, and ctx.scale() below means every
    // drawing call below can keep using the original CW=1000 logical
    // coordinate space unchanged.
    const EXPORT_SCALE = 3;
    canvas.width = W * EXPORT_SCALE;
    canvas.height = H * EXPORT_SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // ---- Outer frame background: rich diagonal gradient + dot texture,
    // giving the whole export a "certificate/share-card" presence rather
    // than content floating on a plain page background ----
    const outerGrad = ctx.createLinearGradient(0, 0, W, H);
    outerGrad.addColorStop(0, '#0A5F56');
    outerGrad.addColorStop(0.55, '#0E8074');
    outerGrad.addColorStop(1, '#C08A2E');
    ctx.fillStyle = outerGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#ffffff';
    const dotSpacing = 34;
    for(let gx = 0; gx < W; gx += dotSpacing){
      for(let gy = 0; gy < H; gy += dotSpacing){
        ctx.beginPath();
        ctx.arc(gx, gy, 1.6, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();

    // Inner content card (rounded, soft mint background, drop shadow) —
    // everything below is drawn relative to this card's top-left corner.
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 50;
    ctx.shadowOffsetY = 18;
    roundedRectPath(ctx, M, M, CW, CH, 34);
    ctx.fillStyle = '#F3FAF9';
    ctx.fill();
    ctx.restore();

    ctx.save();
    roundedRectPath(ctx, M, M, CW, CH, 34);
    ctx.clip();
    ctx.translate(M, M);
    const W_INNER = CW, H_INNER = CH;

    // Background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H_INNER);
    bgGrad.addColorStop(0, '#E7F5F3');
    bgGrad.addColorStop(0.5, '#F3FAF9');
    bgGrad.addColorStop(1, '#EFF8F6');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W_INNER, H_INNER);

    // Decorative soft circles in the header, for visual interest
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#D9EFEC';
    ctx.beginPath(); ctx.arc(-60, 40, 180, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W_INNER+40, 120, 140, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // A few thin gold ring accents + tiny dots scattered near the top
    // corners for a touch more polish, echoing the site's brand marks
    // without competing with the photo/name.
    ctx.save();
    ctx.strokeStyle = 'rgba(192,138,46,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(64, 210, 22, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W_INNER - 56, 230, 14, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(14,128,116,0.4)';
    ctx.beginPath(); ctx.arc(108, 170, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W_INNER - 100, 190, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Top gradient accent bar
    const topBarGrad = ctx.createLinearGradient(0, 0, W_INNER, 0);
    topBarGrad.addColorStop(0, '#0E8074');
    topBarGrad.addColorStop(1, '#C08A2E');
    ctx.fillStyle = topBarGrad;
    ctx.fillRect(0, 0, W_INNER, 16);

    // Official BdJSO + SPSB logos (embedded as data URIs — always loads,
    // no cross-origin issues), shown together at the top of the card.
    const bdjsoLogoImg = await loadImageSafe(BDJSO_LOGO);
    const spsbLogoImg = await loadImageSafe(SPSB_LOGO);
    // Logos sit at the two opposite top corners (BdJSO on the left,
    // SPSB on the right), drawn directly on the background — no plate
    // or border behind them.
    const logoH = 70, logoY = 26, logoMargin = 60;
    const bdjsoW = bdjsoLogoImg ? logoH * (bdjsoLogoImg.width / bdjsoLogoImg.height) : 0;
    const spsbW = spsbLogoImg ? logoH * (spsbLogoImg.width / spsbLogoImg.height) : 0;
    if(bdjsoLogoImg) ctx.drawImage(bdjsoLogoImg, logoMargin, logoY, bdjsoW, logoH);
    if(spsbLogoImg) ctx.drawImage(spsbLogoImg, W_INNER - logoMargin - spsbW, logoY, spsbW, logoH);

    // Eyebrow pill — small sparkle accents flanking the text and a
    // gentle gradient fill instead of a flat tint, for a bit more polish.
    ctx.textAlign = 'center';
    const eyebrow = 'EXECUTIVE TEAM · BdJSO';
    ctx.font = "700 16px 'Manrope', sans-serif";
    const eyebrowW = ctx.measureText(eyebrow).width + 74;
    const eyebrowGrad = ctx.createLinearGradient(W_INNER/2 - eyebrowW/2, 0, W_INNER/2 + eyebrowW/2, 0);
    eyebrowGrad.addColorStop(0, 'rgba(14,128,116,0.06)');
    eyebrowGrad.addColorStop(0.5, 'rgba(14,128,116,0.16)');
    eyebrowGrad.addColorStop(1, 'rgba(14,128,116,0.06)');
    roundedRectPath(ctx, W_INNER/2 - eyebrowW/2, 96, eyebrowW, 40, 20);
    ctx.fillStyle = eyebrowGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(14,128,116,0.22)';
    ctx.lineWidth = 1;
    roundedRectPath(ctx, W_INNER/2 - eyebrowW/2, 96, eyebrowW, 40, 20);
    ctx.stroke();
    ctx.fillStyle = '#0A5F56';
    ctx.fillText(eyebrow, W_INNER/2, 121);
    ctx.font = "600 15px 'Manrope', sans-serif";
    ctx.fillStyle = '#C08A2E';
    ctx.fillText('✦', W_INNER/2 - eyebrowW/2 + 22, 121);
    ctx.fillText('✦', W_INNER/2 + eyebrowW/2 - 22, 121);

    // Photo — try the real photo first (needs CORS from its host, which
    // Google Drive doesn't provide directly), then via a CORS-enabling
    // proxy (images.weserv.nl re-fetches the photo server-side and adds
    // the necessary header), and only fall back to the local initials
    // avatar if both of those fail.
    let photoImg = await loadImageSafe(p.photo);
    if(!photoImg && p.photo && /^https?:\/\//i.test(p.photo)){
      const proxied = 'https://images.weserv.nl/?url=' + encodeURIComponent(p.photo.replace(/^https?:\/\//i, '')) + '&w=600&h=600&fit=cover';
      photoImg = await loadImageSafe(proxied);
    }
    if(!photoImg){
      const avatarSrc = (p.photo && p.photo.startsWith('data:image/svg')) ? p.photo : localAvatar(p.name, p.avatarSeed || 0);
      photoImg = await loadImageSafe(avatarSrc);
    }
    const currentGroup = (hist[0] && GROUP_COLOR[hist[0].group]) || GROUP_COLOR.coordinators;

    // Large rectangular "front-page style" photo — bleeds edge to edge
    // within the header band, with a top-anchored crop so the face and
    // shoulders stay in frame rather than the torso.
    const photoAreaX = infoCardX, photoAreaY = PHOTO_AREA_Y, photoAreaW = infoCardW, photoAreaH = PHOTO_AREA_H;

    ctx.save();
    ctx.shadowColor = 'rgba(15,43,40,0.28)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 14;
    roundedRectPath(ctx, photoAreaX, photoAreaY, photoAreaW, photoAreaH, 26);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    ctx.save();
    roundedRectPath(ctx, photoAreaX, photoAreaY, photoAreaW, photoAreaH, 26);
    ctx.clip();
    if(photoImg){
      const iw = photoImg.width, ih = photoImg.height;
      const scale = Math.max(photoAreaW/iw, photoAreaH/ih);
      const dw = iw*scale, dh = ih*scale;
      const dx = photoAreaX + photoAreaW/2 - dw/2;
      // Anchor toward the top of the source photo (like object-position:
      // top) so the face stays in frame rather than the torso/legs.
      const dy = photoAreaY - dh*0.03;
      ctx.drawImage(photoImg, dx, dy, dw, dh);

      // Dark bottom fade so the name/role text overlaid on the photo
      // stays legible, matching the reference's text-on-photo look.
      const bottomFade = ctx.createLinearGradient(0, photoAreaY + photoAreaH*0.6, 0, photoAreaY + photoAreaH);
      bottomFade.addColorStop(0, 'rgba(15,43,40,0)');
      bottomFade.addColorStop(1, 'rgba(11,27,25,0.82)');
      ctx.fillStyle = bottomFade;
      ctx.fillRect(photoAreaX, photoAreaY, photoAreaW, photoAreaH);
    }
    ctx.restore();

    // Reusable seal-badge drawer — a wavy-edged gold-and-red seal with
    // laurel leaves and a "TEAM SPSB" ribbon. Used both as the solid
    // badge over the photo, and again later as a large, faint
    // watermark behind the contact-info card for a premium touch.
    function drawSealBadge(cx, cy, outerR, alpha){
      const innerR = outerR * 0.82;
      ctx.save();
      ctx.globalAlpha = alpha;

      if(alpha >= 1){
        ctx.shadowColor = 'rgba(15,43,40,0.4)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 7;
      }

      // Outer gold ring — a smooth wavy (scalloped) contour, not a
      // sharp zigzag, to match a classic seal shape.
      function wavyPath(r, waveAmp, waveCount, phase){
        ctx.beginPath();
        const steps = 120;
        for(let i = 0; i <= steps; i++){
          const a = (i / steps) * Math.PI * 2;
          const rr = r + Math.sin(a * waveCount + phase) * waveAmp;
          const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
          if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }
      wavyPath(outerR, outerR*0.077, 14, 0);
      const goldGrad = ctx.createLinearGradient(cx - outerR, cy - outerR, cx + outerR, cy + outerR);
      goldGrad.addColorStop(0, '#F3D999');
      goldGrad.addColorStop(0.5, '#C9963E');
      goldGrad.addColorStop(1, '#8E6420');
      ctx.fillStyle = goldGrad;
      ctx.fill();
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      // Beaded dot ring, between the gold rim and the red face
      const beadCount = 40;
      for(let i = 0; i < beadCount; i++){
        const a = (i / beadCount) * Math.PI * 2;
        const br = (outerR + innerR) / 2;
        const bx = cx + Math.cos(a) * br, by = cy + Math.sin(a) * br;
        ctx.beginPath();
        ctx.arc(bx, by, Math.max(1.2, outerR*0.02), 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fill();
      }

      // Inner red face, its own gentler scalloped edge
      wavyPath(innerR, outerR*0.051, 14, 0);
      const redGrad = ctx.createRadialGradient(cx, cy - innerR*0.16, outerR*0.08, cx, cy, innerR);
      redGrad.addColorStop(0, '#E8453F');
      redGrad.addColorStop(0.6, '#B4211E');
      redGrad.addColorStop(1, '#7A1210');
      ctx.fillStyle = redGrad;
      ctx.fill();

      // Small laurel leaf sprigs, flanking the lower sides of the seal
      function drawLeafSprig(lx, ly, angleDeg, mirror){
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(angleDeg * Math.PI/180);
        if(mirror) ctx.scale(-1, 1);
        const leafScale = outerR / 78;
        for(let i = 0; i < 4; i++){
          ctx.save();
          ctx.translate(i * 8 * leafScale, 0);
          ctx.rotate(-0.35);
          ctx.beginPath();
          ctx.ellipse(0, 0, 7*leafScale, 3.2*leafScale, 0, 0, Math.PI*2);
          ctx.fillStyle = i % 2 === 0 ? '#E8C878' : '#C9963E';
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }
      drawLeafSprig(cx - innerR*0.55, cy + innerR*0.45, 200, false);
      drawLeafSprig(cx + innerR*0.55, cy + innerR*0.45, -20, true);

      // Ribbon banner across the lower third of the seal
      const ribbonY = cy + innerR*0.42, ribbonH = outerR*0.33, ribbonHalfW = outerR + outerR*0.077;
      const notch = outerR*0.09;
      ctx.beginPath();
      ctx.moveTo(cx - ribbonHalfW, ribbonY - ribbonH/2);
      ctx.lineTo(cx + ribbonHalfW, ribbonY - ribbonH/2);
      ctx.lineTo(cx + ribbonHalfW - notch, ribbonY);
      ctx.lineTo(cx + ribbonHalfW, ribbonY + ribbonH/2);
      ctx.lineTo(cx - ribbonHalfW, ribbonY + ribbonH/2);
      ctx.lineTo(cx - ribbonHalfW + notch, ribbonY);
      ctx.closePath();
      const ribbonGrad = ctx.createLinearGradient(cx, ribbonY - ribbonH/2, cx, ribbonY + ribbonH/2);
      ribbonGrad.addColorStop(0, '#F3D999');
      ribbonGrad.addColorStop(0.5, '#D9A93F');
      ribbonGrad.addColorStop(1, '#A8781F');
      ctx.fillStyle = ribbonGrad;
      ctx.fill();
      ctx.lineWidth = Math.max(1, outerR*0.013);
      ctx.strokeStyle = 'rgba(122,18,16,0.4)';
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#7A1210';
      ctx.font = `700 ${Math.round(outerR*0.154)}px 'Manrope', sans-serif`;
      ctx.fillText('TEAM SPSB', cx, ribbonY + outerR*0.051);

      // Year count, centered in the upper part of the red face
      ctx.fillStyle = '#FBE7B0';
      ctx.font = `700 ${Math.round(outerR*0.385)}px 'Manrope', sans-serif`;
      ctx.fillText(String(hist.length), cx, cy - outerR*0.18);
      ctx.font = `700 ${Math.round(outerR*0.154)}px 'Manrope', sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(hist.length > 1 ? 'YEARS' : 'YEAR', cx, cy + outerR*0.05);

      ctx.restore();
    }

    // The solid badge, over the top-right corner of the photo
    const yrBadgeCX = photoAreaX + photoAreaW - 84, yrBadgeCY = photoAreaY + 84;
    drawSealBadge(yrBadgeCX, yrBadgeCY, 78, 1);

    // Name / role — overlaid bottom-left directly on the photo, like
    // the reference (white name, gold role caption, sitting on the
    // dark fade instead of a separate block below the photo).
    ctx.textAlign = 'left';
    let overlayNameFontSize = nameFontSize;
    ctx.font = `700 ${overlayNameFontSize}px 'Manrope', sans-serif`;
    const maxOverlayNameWidth = photoAreaW - 76;
    while(overlayNameFontSize > 26 && ctx.measureText(p.name).width > maxOverlayNameWidth){
      overlayNameFontSize -= 2;
      ctx.font = `700 ${overlayNameFontSize}px 'Manrope', sans-serif`;
    }
    const overlayNameLines = ctx.measureText(p.name).width > maxOverlayNameWidth
      ? wrapTextLines(ctx, p.name, maxOverlayNameWidth)
      : [p.name];
    const overlayLineH = overlayNameFontSize * 1.18;
    const roleLabel = (GROUP_LABEL[hist[0] && hist[0].group] || 'Executive').toUpperCase();

    const overlayTextX = photoAreaX + 38;
    const roleY = photoAreaY + photoAreaH - 40;
    const nameBlockH = overlayNameLines.length * overlayLineH;
    const nameStartY = roleY - 34 - nameBlockH + overlayLineH;
    ctx.fillStyle = '#FFFFFF';
    overlayNameLines.forEach((line, i) => { ctx.fillText(line, overlayTextX, nameStartY + i*overlayLineH); });

    ctx.font = "700 20px 'Manrope', sans-serif";
    ctx.fillStyle = '#E4B15A';
    ctx.fillText(roleLabel, overlayTextX, roleY);

    // ---- Info card ----
    if(infoRows.length){
      const cardX = infoCardX, cardW = infoCardW;
      ctx.save();
      ctx.shadowColor = 'rgba(15,43,40,0.10)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 8;
      roundedRectPath(ctx, cardX, infoCardY, cardW, infoCardH, 28);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();

      // Large faint "TEAM SPSB" seal watermark behind the contact info,
      // for a premium touch — clipped to the card so it never spills
      // past its rounded corners.
      ctx.save();
      roundedRectPath(ctx, cardX, infoCardY, cardW, infoCardH, 28);
      ctx.clip();
      drawSealBadge(cardX + cardW - infoCardH*0.32, infoCardY + infoCardH*0.5, infoCardH*0.85, 0.10);
      ctx.restore();

      ctx.textAlign = 'left';
      let rowY = infoCardY + infoCardPad;
      infoRowsWrapped.forEach(({ emoji, label, lines, rowHeight }, i) => {
        const textBlockH = rowLabelH + lines.length*rowLineH;
        const iconCX = cardX + 54, iconCY = rowY + textBlockH/2 - 8;
        ctx.beginPath();
        ctx.arc(iconCX, iconCY, 26, 0, Math.PI*2);
        ctx.fillStyle = currentGroup.soft;
        ctx.fill();
        ctx.font = "24px 'Manrope', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillText(emoji, iconCX, iconCY + 9);

        ctx.textAlign = 'left';
        ctx.fillStyle = currentGroup.main;
        ctx.font = "700 14px 'Manrope', sans-serif";
        ctx.fillText(label.toUpperCase(), cardX + 96, rowY - 2);
        ctx.fillStyle = '#0F2B28';
        ctx.font = "600 25px 'Manrope', sans-serif";
        let lineY = rowY + rowLabelH;
        lines.forEach(line => { ctx.fillText(line, cardX + 96, lineY); lineY += rowLineH; });

        if(i < infoRowsWrapped.length - 1){
          ctx.strokeStyle = 'rgba(15,43,40,0.08)';
          ctx.lineWidth = 1;
          const dividerY = rowY + rowHeight - rowBottomPad/2;
          ctx.beginPath();
          ctx.moveTo(cardX + 32, dividerY);
          ctx.lineTo(cardX + cardW - 32, dividerY);
          ctx.stroke();
        }
        rowY += rowHeight;
      });
    }

    // ---- Full history timeline (in its own card, matching the info card) ----
    const histCardX = 70, histCardW = W_INNER - 140;
    ctx.save();
    ctx.shadowColor = 'rgba(15,43,40,0.10)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    roundedRectPath(ctx, histCardX, histSectionY, histCardW, histCardH, 28);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = '#0F2B28';
    ctx.font = "700 26px 'Fraunces', serif";
    ctx.fillText(`Full history — ${hist.length} year${hist.length > 1 ? 's' : ''}`, histCardX + 40, histSectionY + histCardPad + 6);
    ctx.strokeStyle = 'rgba(15,43,40,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(histCardX + 40, histSectionY + histCardPad + 24);
    ctx.lineTo(histCardX + histCardW - 40, histSectionY + histCardPad + 24);
    ctx.stroke();

    const histBodyTop = histSectionY + histCardPad + histHeaderH - 30;
    const histContentX = histCardX + 40, histContentW = histCardW - 80;
    const histColGap = 40;
    const histColW = histCols > 1 ? (histContentW - histColGap) / 2 : histContentW;

    // Subtle vertical divider between the two columns
    if(histCols > 1){
      ctx.strokeStyle = 'rgba(15,43,40,0.08)';
      ctx.lineWidth = 1;
      const dividerX = histContentX + histColW + histColGap/2;
      ctx.beginPath();
      ctx.moveTo(dividerX, histBodyTop - 6);
      ctx.lineTo(dividerX, histBodyTop + histRowsPerCol*histRowH - 20);
      ctx.stroke();
    }

    for(let col = 0; col < histCols; col++){
      const colX = histContentX + col*(histColW + histColGap);
      for(let r = 0; r < histRowsPerCol; r++){
        const i = col*histRowsPerCol + r;
        if(i >= hist.length) break;
        const h = hist[i];
        const gc = GROUP_COLOR[h.group] || GROUP_COLOR.coordinators;
        const rowTop = histBodyTop + r*histRowH;
        const dotX = colX + 12, rowCenterY = rowTop + histRowH/2 - 10;

        if(r < histRowsPerCol - 1 && i + 1 < hist.length){
          ctx.strokeStyle = 'rgba(15,43,40,0.15)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(dotX, rowCenterY + 10);
          ctx.lineTo(dotX, rowCenterY + histRowH);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(dotX, rowCenterY, 10, 0, Math.PI*2);
        ctx.fillStyle = gc.main;
        ctx.fill();

        // Year badge
        ctx.font = "700 15px 'Manrope', sans-serif";
        const yearLabel = String(h.year);
        const yearW = ctx.measureText(yearLabel).width + 28;
        const yearBadgeX = dotX + 24;
        roundedRectPath(ctx, yearBadgeX, rowCenterY - 17, yearW, 34, 17);
        ctx.fillStyle = gc.soft;
        ctx.fill();
        ctx.fillStyle = gc.main;
        ctx.textAlign = 'center';
        ctx.fillText(yearLabel, yearBadgeX + yearW/2, rowCenterY + 5);

        ctx.textAlign = 'left';
        ctx.fillStyle = '#0F2B28';
        ctx.font = "700 21px 'Manrope', sans-serif";
        ctx.fillText(h.role, yearBadgeX + yearW + 16, rowCenterY - 2);
        ctx.fillStyle = gc.main;
        ctx.font = "700 13px 'Manrope', sans-serif";
        ctx.fillText((GROUP_LABEL[h.group] || h.group).toUpperCase(), yearBadgeX + yearW + 16, rowCenterY + 20);
      }
    }

    // Footer
    const footerY = histSectionY + histCardH + 34;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0A5F56';
    ctx.font = "700 22px 'Manrope', sans-serif";
    ctx.fillText('Bangladesh Junior Science Olympiad', W_INNER/2, footerY + 40);
    ctx.fillStyle = '#0E8074';
    ctx.font = "600 17px 'Manrope', sans-serif";
    ctx.fillText('Executive Team', W_INNER/2, footerY + 70);

    // Small gold divider ornament
    ctx.fillStyle = '#C08A2E';
    ctx.font = "18px 'Manrope', sans-serif";
    ctx.fillText('✦', W_INNER/2, footerY + 98);

    // Bottom gradient accent bar (mirrors the top), inside the card
    ctx.fillStyle = topBarGrad;
    ctx.fillRect(0, H_INNER - 16, W_INNER, 16);

    ctx.restore(); // end inner clip/translate

    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  // ============================================================
  // ID-CARD STYLE SHARE IMAGE — front + back, like a navy ID
  // badge. Front: the two org logos up top, the photo, the name,
  // and a role/designation pill (Core Team / Volunteer & Mentor /
  // Coordinator, plus the year). Back: institution/phone/email/
  // location and the full multi-year history. Both cards render
  // as a single side-by-side "spread" image, mockup-style, on a
  // light neutral backdrop with drop shadows under each card.
  // ============================================================
  async function buildIdCardPng(p){
    if(document.fonts && document.fonts.ready){ try { await document.fonts.ready; } catch(e){} }

    const hist = sortedHistory(p);
    const GROUP_COLOR = {
      coordinators: { main: '#2FBF9F', soft: 'rgba(47,191,159,0.18)' },
      core_team:    { main: '#E4B15A', soft: 'rgba(228,177,90,0.18)' },
      volunteers:   { main: '#9C8CF0', soft: 'rgba(156,140,240,0.18)' },
      executives:   { main: '#2FBF9F', soft: 'rgba(47,191,159,0.18)' }
    };
    const GROUP_LABEL = { coordinators: 'Coordinator', core_team: 'Core Team', volunteers: 'Volunteer & Mentor', executives: 'Executive' };

    function maskPhone(phone){
      const digits = String(phone).replace(/[^0-9]/g, '');
      if(digits.length <= 3) return phone;
      return digits.slice(0, -3) + '***';
    }
    function districtOnly(address){
      if(!address) return '';
      const explicit = address.match(/Dis(?:trict)?:\s*([^,]+)/i);
      if(explicit) return explicit[1].trim().replace(/\.$/, '');
      const parts = address.split(',').map(s => s.trim()).filter(Boolean);
      let last = parts[parts.length - 1] || address.trim();
      last = last.replace(/-?\s*\d{3,4}$/, '').replace(/\.$/, '').trim();
      return last;
    }
    const instText = [p.institution, p.department].filter(Boolean).join(' — ');
    const presentDistrict = districtOnly(p.presentAddress);
    const permanentDistrict = districtOnly(p.permanentAddress);
    const addressText = presentDistrict
      ? `${presentDistrict}${permanentDistrict && permanentDistrict !== presentDistrict ? ` (Permanent: ${permanentDistrict})` : ''}`
      : (permanentDistrict || '');
    const ORG_LABEL_NAMES = ['Munir Hasan', 'Farseem Mannan Mohammady', 'Mahmud Mim'];
    const instLabel = ORG_LABEL_NAMES.includes(p.name) ? 'ORGANIZATION' : 'INSTITUTION';
    const infoRows = [];
    if(instText) infoRows.push(['🎓', instLabel, instText]);
    if(p.phone) infoRows.push(['📞', 'PHONE', maskPhone(p.phone)]);
    if(p.email) infoRows.push(['✉️', 'EMAIL', p.email]);
    if(addressText) infoRows.push(['📍', 'LOCATION', addressText]);

    function wrapTextLines(mctx, text, maxWidth){
      const words = String(text).split(/\s+/).filter(Boolean);
      const lines = [];
      let current = '';
      words.forEach(word => {
        const test = current ? current + ' ' + word : word;
        if(current && mctx.measureText(test).width > maxWidth){
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      });
      if(current) lines.push(current);
      return lines.length ? lines : [''];
    }

    const mctx = document.createElement('canvas').getContext('2d');
    const currentGroup = (hist[0] && GROUP_COLOR[hist[0].group]) || GROUP_COLOR.coordinators;

    // ---- Layout ----
    const CARD_W = 620, CARD_H = 1000, GAP = 70, MARGIN = 70;
    const LANYARD_H = 170; // room above the cards for the cord + clip
    const CARD_TOP = MARGIN + LANYARD_H;
    const W = MARGIN*2 + CARD_W*2 + GAP, H = MARGIN + LANYARD_H + CARD_H + MARGIN;
    const EXPORT_SCALE = 3;

    const canvas = document.createElement('canvas');
    canvas.width = W * EXPORT_SCALE;
    canvas.height = H * EXPORT_SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Neutral backdrop the two cards sit on, mockup-style
    ctx.fillStyle = '#E9EDF1';
    ctx.fillRect(0, 0, W, H);

    // Lanyard cord + badge clip, drawn above a card — matches a
    // real ID-badge mockup: a twisted black strap running up off
    // the top of the canvas, into a silver connector and a dark
    // plastic alligator-style badge clip that grips the card edge.
    function drawLanyard(cx){
      ctx.save();
      const strapW = 26, topY = 6, clipTopY = CARD_TOP - 96;
      // Strap (slightly tapered, with a subtle twist rendered as
      // alternating light/dark bands)
      const strapGrad = ctx.createLinearGradient(cx - strapW/2, 0, cx + strapW/2, 0);
      strapGrad.addColorStop(0, '#0A0A0A');
      strapGrad.addColorStop(0.5, '#2B2B2E');
      strapGrad.addColorStop(1, '#0A0A0A');
      ctx.fillStyle = strapGrad;
      ctx.fillRect(cx - strapW/2, topY, strapW, clipTopY - topY);
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#ffffff';
      for(let i = 0; i < 6; i++){
        const segY = topY + (clipTopY - topY) * (i / 6) + 6;
        ctx.fillRect(cx - strapW/2, segY, strapW, 5);
      }
      ctx.restore();

      // Silver connector piece
      ctx.fillStyle = '#C9CDD3';
      roundedRectPath(ctx, cx - 15, clipTopY, 30, 26, 6);
      ctx.fill();
      ctx.strokeStyle = '#9DA2AA'; ctx.lineWidth = 1.5;
      roundedRectPath(ctx, cx - 15, clipTopY, 30, 26, 6);
      ctx.stroke();

      // Dark plastic badge clip body
      const clipBodyY = clipTopY + 22, clipBodyH = 70;
      const clipGrad = ctx.createLinearGradient(cx - 34, clipBodyY, cx + 34, clipBodyY + clipBodyH);
      clipGrad.addColorStop(0, '#3A3A3E');
      clipGrad.addColorStop(0.5, '#1A1A1D');
      clipGrad.addColorStop(1, '#2E2E32');
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
      roundedRectPath(ctx, cx - 34, clipBodyY, 68, clipBodyH, 10);
      ctx.fillStyle = clipGrad;
      ctx.fill();
      ctx.restore();
      // Ridge lines + oval loop hole, for a bit of plastic-clip detail
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;
      for(let i = 0; i < 4; i++){
        const ly = clipBodyY + 14 + i*11;
        ctx.beginPath(); ctx.moveTo(cx - 22, ly); ctx.lineTo(cx + 22, ly); ctx.stroke();
      }
      ctx.fillStyle = '#0B1B3D';
      ctx.beginPath(); ctx.ellipse(cx, clipBodyY + clipBodyH - 12, 9, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function navyCardBackground(){
      const grad = ctx.createLinearGradient(0, 0, CARD_W, CARD_H);
      grad.addColorStop(0, '#0B1B3D');
      grad.addColorStop(0.55, '#152F63');
      grad.addColorStop(1, '#1E3A6E');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CARD_W, CARD_H);
      // Soft glow circles, echoing the reference mockup's corner glow
      ctx.save();
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(-40, CARD_H+30, 220, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(CARD_W+30, -30, 150, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function startCard(x){
      ctx.save();
      // Drop shadow under the whole card
      ctx.save();
      ctx.shadowColor = 'rgba(10,20,40,0.35)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 18;
      roundedRectPath(ctx, x, CARD_TOP, CARD_W, CARD_H, 26);
      ctx.fillStyle = '#0B1B3D';
      ctx.fill();
      ctx.restore();
      roundedRectPath(ctx, x, CARD_TOP, CARD_W, CARD_H, 26);
      ctx.clip();
      ctx.translate(x, CARD_TOP);
      navyCardBackground();
    }
    function endCard(){ ctx.restore(); }

    const bdjsoLogoImg = await loadImageSafe(BDJSO_LOGO);
    const spsbLogoImg = await loadImageSafe(SPSB_LOGO);
    let photoImg = await loadImageSafe(p.photo);
    if(!photoImg && p.photo && /^https?:\/\//i.test(p.photo)){
      const proxied = 'https://images.weserv.nl/?url=' + encodeURIComponent(p.photo.replace(/^https?:\/\//i, '')) + '&w=600&h=600&fit=cover';
      photoImg = await loadImageSafe(proxied);
    }
    if(!photoImg){
      const avatarSrc = (p.photo && p.photo.startsWith('data:image/svg')) ? p.photo : localAvatar(p.name, p.avatarSeed || 0);
      photoImg = await loadImageSafe(avatarSrc);
    }

    // Lanyard sits above the front card only, matching the reference mockup
    drawLanyard(MARGIN + CARD_W/2);

    // ---------------- FRONT CARD ----------------
    startCard(MARGIN);
    {
      // Logo lockup, centered at the very top — both org marks
      // side by side, spanning toward the card's center.
      const logoH = 34, logoY = 30;
      const bdjsoW = bdjsoLogoImg ? logoH * (bdjsoLogoImg.width / bdjsoLogoImg.height) : 0;
      const spsbW = spsbLogoImg ? logoH * (spsbLogoImg.width / spsbLogoImg.height) : 0;
      const logoGap = 20;
      const totalLogoW = bdjsoW + (spsbLogoImg ? logoGap + spsbW : 0);
      let lx = CARD_W/2 - totalLogoW/2;
      if(bdjsoLogoImg){
        roundedRectPath(ctx, lx - 8, logoY - 7, bdjsoW + 16, logoH + 14, 9);
        ctx.fillStyle = 'rgba(255,255,255,0.90)';
        ctx.fill();
        ctx.drawImage(bdjsoLogoImg, lx, logoY, bdjsoW, logoH);
        lx += bdjsoW + logoGap;
      }
      if(spsbLogoImg){
        roundedRectPath(ctx, lx - 8, logoY - 7, spsbW + 16, logoH + 14, 9);
        ctx.fillStyle = 'rgba(255,255,255,0.90)';
        ctx.fill();
        ctx.drawImage(spsbLogoImg, lx, logoY, spsbW, logoH);
      }

      // Large, near-full-bleed photo — starts just below the logo
      // row and fills the rest of the card edge to edge, like the
      // reference badge.
      const photoAreaX = 0;
      const photoAreaY = logoY + logoH + 30;
      const photoAreaW = CARD_W;
      const photoAreaH = CARD_H - photoAreaY;
      if(photoImg){
        ctx.save();
        roundedRectPath(ctx, photoAreaX, photoAreaY, photoAreaW, photoAreaH, 0);
        ctx.clip();
        const iw = photoImg.width, ih = photoImg.height;
        const scale = Math.max(photoAreaW/iw, photoAreaH/ih);
        const dw = iw*scale, dh = ih*scale;
        const dx = photoAreaX + photoAreaW/2 - dw/2;
        // Anchor the crop toward the TOP of the source photo (like
        // object-position: top) so the face stays in frame — most
        // headshots/portraits have the face in the upper portion,
        // and a taller-than-box image needs its bottom (torso/legs)
        // cropped away, not its top.
        const dy = photoAreaY - dh*0.03;
        ctx.drawImage(photoImg, dx, dy, dw, dh);
        // Bottom fade so the name/role text stays legible sitting
        // directly on the photo, matching the reference.
        const bottomFade = ctx.createLinearGradient(0, photoAreaY + photoAreaH*0.55, 0, photoAreaY + photoAreaH);
        bottomFade.addColorStop(0, 'rgba(11,27,61,0)');
        bottomFade.addColorStop(1, 'rgba(11,27,61,0.92)');
        ctx.fillStyle = bottomFade;
        ctx.fillRect(photoAreaX, photoAreaY, photoAreaW, photoAreaH);
        // Soft top fade so the photo doesn't hard-cut against the logo row
        const topFade = ctx.createLinearGradient(0, photoAreaY, 0, photoAreaY + photoAreaH*0.12);
        topFade.addColorStop(0, 'rgba(11,27,61,0.7)');
        topFade.addColorStop(1, 'rgba(11,27,61,0)');
        ctx.fillStyle = topFade;
        ctx.fillRect(photoAreaX, photoAreaY, photoAreaW, photoAreaH*0.12);
        ctx.restore();
      }

      // Name / role / year — bottom-left, sitting directly on the
      // photo, reference-style.
      const textX = 34;
      let nameFontSize = 30;
      ctx.font = `700 ${nameFontSize}px 'Manrope', sans-serif`;
      const maxNameWidth = CARD_W - textX*2;
      while(nameFontSize > 20 && ctx.measureText(p.name).width > maxNameWidth){
        nameFontSize -= 2;
        ctx.font = `700 ${nameFontSize}px 'Manrope', sans-serif`;
      }
      const nameLines = ctx.measureText(p.name).width > maxNameWidth ? wrapTextLines(ctx, p.name, maxNameWidth) : [p.name];
      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFFFFF';
      const nameLineH = nameFontSize * 1.15;
      const roleLabel = (GROUP_LABEL[hist[0] && hist[0].group] || 'Executive').toUpperCase();
      const yearLabel = hist[0] ? String(hist[0].year) : '';
      const captionText = `BdJSO · ${yearLabel} · ${hist.length} ${hist.length > 1 ? 'yrs' : 'yr'}`;

      const captionY = CARD_H - 34;
      const roleY = captionY - 26;
      const nameBlockBottom = roleY - 30;
      const nameBlockH = nameLines.length * nameLineH;
      const nameStartY = nameBlockBottom - nameBlockH + nameLineH;
      nameLines.forEach((line, i) => { ctx.fillText(line, textX, nameStartY + i*nameLineH); });

      ctx.font = "700 17px 'Manrope', sans-serif";
      ctx.fillStyle = '#E4B15A';
      ctx.fillText(roleLabel, textX, roleY);

      ctx.font = "600 14px 'Manrope', sans-serif";
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillText(captionText, textX, captionY);
    }
    endCard();

    // ---------------- BACK CARD ----------------
    startCard(MARGIN + CARD_W + GAP);
    {
      const padX = 56;
      let y = 70;
      ctx.textAlign = 'center';
      ctx.font = "700 22px 'Fraunces', serif";
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('Contact & Full History', CARD_W/2, y);
      y += 14;
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(CARD_W - padX, y); ctx.stroke();
      y += 36;

      ctx.textAlign = 'left';
      const valueMaxWidth = CARD_W - padX*2 - 56;
      infoRows.forEach(([emoji, label, value]) => {
        ctx.font = "700 12px 'Manrope', sans-serif";
        ctx.fillStyle = '#E4B15A';
        ctx.fillText(label, padX + 44, y);
        ctx.font = "600 17px 'Manrope', sans-serif";
        ctx.fillStyle = '#FFFFFF';
        const lines = wrapTextLines(ctx, value, valueMaxWidth);
        let vy = y + 22;
        lines.forEach(line => { ctx.fillText(line, padX + 44, vy); vy += 23; });
        ctx.font = '18px sans-serif';
        ctx.fillText(emoji, padX, y + 14);
        y = vy + 16;
      });

      y += 6;
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(CARD_W - padX, y); ctx.stroke();
      y += 36;

      ctx.font = "700 15px 'Manrope', sans-serif";
      ctx.fillStyle = '#D6E4FF';
      ctx.fillText(`FULL HISTORY — ${hist.length} ${hist.length > 1 ? 'YEARS' : 'YEAR'}`, padX, y);
      y += 26;

      hist.forEach(h => {
        const gc = GROUP_COLOR[h.group] || GROUP_COLOR.coordinators;
        // Year badge
        ctx.font = "700 13px 'Manrope', sans-serif";
        const yearW = ctx.measureText(String(h.year)).width + 24;
        roundedRectPath(ctx, padX, y - 18, yearW, 28, 14);
        ctx.fillStyle = gc.soft; ctx.fill();
        ctx.fillStyle = gc.main;
        ctx.textAlign = 'center';
        ctx.fillText(String(h.year), padX + yearW/2, y + 1);
        ctx.textAlign = 'left';
        ctx.font = "700 17px 'Manrope', sans-serif";
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(h.role, padX + yearW + 16, y + 2);
        y += 40;
      });

      // Footer sign-off
      const footerY = CARD_H - 100;
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.moveTo(CARD_W/2 - 70, footerY); ctx.lineTo(CARD_W/2 + 70, footerY); ctx.stroke();
      ctx.font = "600 14px 'Manrope', sans-serif";
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('Yours in Science', CARD_W/2, footerY + 30);
      ctx.font = "700 15px 'Fraunces', serif";
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('Bangladesh Junior Science Olympiad', CARD_W/2, footerY + 58);
    }
    endCard();

    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  async function sharePerson(){
    const p = currentModalPerson;
    if(!p) return;
    const btn = document.getElementById('modalShare');
    const originalTitle = btn ? btn.getAttribute('title') : null;
    if(btn) btn.setAttribute('title', 'Preparing image…');

    let blob;
    try {
      blob = await buildSharePng(p);
    } catch(err){
      blob = null;
    }

    if(!blob){
      if(btn && originalTitle) btn.setAttribute('title', originalTitle);
      window.alert("Couldn't generate the share image — please try again.");
      return;
    }

    const fileName = `${p.name.replace(/[^a-z0-9]+/gi, '_')}.png`;
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file], title: p.name, text: `${p.name} — BdJSO Executive Team` });
        if(btn && originalTitle) btn.setAttribute('title', originalTitle);
        return;
      } catch(err){
        // User cancelled — fall through to download so they still have the option.
      }
    }

    // Fallback: download the PNG so it can be shared manually.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if(btn){
      btn.classList.add('copied');
      btn.setAttribute('title', 'Downloaded!');
      setTimeout(() => { btn.classList.remove('copied'); if(originalTitle) btn.setAttribute('title', originalTitle); }, 1500);
    }
  }

  // Runs setup once the page's HTML actually exists — protects against
  // tools that insert this script before the HTML tab's markup loads.
  function init(){
    const overlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalShare = document.getElementById('modalShare');
    if(!overlay || !modalClose || !document.getElementById('yearTabs')){
      // HTML not in the DOM yet — try again shortly instead of failing silently.
      setTimeout(init, 50);
      return;
    }
    modalClose.addEventListener('click', closeModal);
    if(modalShare) modalShare.addEventListener('click', sharePerson);
    overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
    const coverImg = document.getElementById('coverImg');
    if(coverImg){
      let coverIndex = 0;
      coverImg.src = COVER_PHOTOS[coverIndex];
      setInterval(() => {
        coverIndex = (coverIndex + 1) % COVER_PHOTOS.length;
        coverImg.style.opacity = '0';
        setTimeout(() => {
          coverImg.src = COVER_PHOTOS[coverIndex];
          coverImg.style.opacity = '1';
        }, 300); // matches half the CSS fade duration, so the swap happens mid-fade
      }, 5000);
    }
    renderTabs();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

</script>
