<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executives</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #F3FAF9;
  --bg-elev: #E7F5F3;
  --card: linear-gradient(160deg, #FFFFFF 0%, #F7FCFB 100%);
  --card-solid: #FFFFFF;
  --card-border: rgba(15,60,55,0.10);
  --text: #0F2B28;
  --muted: #5E7A76;

  /* Primary brand color is teal, matching the reference site. Gold and
     violet remain as secondary accents to keep Core Team/Volunteers
     visually distinct, but teal now leads everywhere (tabs, buttons,
     Coordinators). */
  --teal: #0E8074;
  --teal-dark: #0A5F56;
  --teal-soft: rgba(14,128,116,0.10);
  --gold: #C08A2E;
  --gold-soft: rgba(192,138,46,0.12);
  --violet: #6F63B8;
  --violet-soft: rgba(111,99,184,0.12);
  --rose: #C2577B;
  --rose-soft: rgba(194,87,123,0.12);
  --emerald: #0E8074;
  --emerald-soft: rgba(14,128,116,0.10);

  --shadow-sm: 0 4px 16px rgba(10,60,55,0.06);
  --shadow-lg: 0 24px 56px rgba(10,60,55,0.14);

  /* ============================================================
     PHOTO TOKENS — the single control point for every card photo,
     in every group (Coordinators / Core Team / Volunteers) and
     every year's list (2015–2026). Change a value here once and
     it updates everywhere; nothing below this block sets photo
     size/margin/padding/radius directly.
     ============================================================ */
  --photo-size: 112px;          /* photo box width, regular grid */
  --photo-size-compact: 104px;  /* photo box width, .grid-compact (volunteers) */
  --photo-margin: 8px;          /* space around the photo inside the card */
  --photo-padding: 6px;         /* space between the photo box edge and the image */
  --photo-radius: 12px;         /* corner rounding of the photo image */
  --photo-zoom: 1.15;           /* scales the image up to crop out white/blank
                                    borders baked into some source photos —
                                    this is a zoom, not spacing, so margin/
                                    padding above are untouched by it */
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

/* Soft drifting glow blobs, layered behind the particle canvas for depth
   (like the hazy color glow behind the hero text in the reference image). */
body::before, body::after{
  content:"";
  position: fixed;
  z-index: -2;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
}
body::before{
  top: -10%;
  left: -8%;
  width: 50vw;
  height: 50vw;
  background: radial-gradient(circle, rgba(156,143,217,0.20), transparent 70%);
  animation: blobFloatA 26s ease-in-out infinite alternate;
}
body::after{
  bottom: -12%;
  right: -8%;
  width: 55vw;
  height: 55vw;
  background: radial-gradient(circle, rgba(79,191,159,0.16), transparent 70%);
  animation: blobFloatB 30s ease-in-out infinite alternate;
}
@keyframes blobFloatA{
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(6vw, 8vh) scale(1.12); }
}
@keyframes blobFloatB{
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-7vw, -6vh) scale(1.08); }
}
@media (prefers-reduced-motion: reduce){
  body::before, body::after{ animation: none; }
}

/* Ambient background glow — pure CSS, GPU-composited (transform/opacity
   only), no JS animation loop. This replaces what used to be a canvas
   particle effect, which was costing real CPU every frame. */
.wrap{
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 28px 32px;
  position: relative;
}

/* ---------- Cover banner ---------- */
.cover-banner{
  position: relative;
  overflow: hidden;
  line-height: 0;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  background: linear-gradient(160deg, var(--bg-elev), var(--bg));
}
.cover-banner img{
  width: 100%;
  height: auto;              /* banner height follows the photo's own shape — no blank space above/below */
  max-height: 90vh;
  object-fit: contain;
  object-position: center center;
  display: block;
  margin: 0 auto;
  transition: opacity 0.6s ease;
}
.cover-banner::after{
  content:"";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(12,11,18,0) 60%, var(--bg) 100%);
}


/* ---------- Extruded 3D "SPSB" watermark ----------
   Pure CSS extrusion: dozens of stacked text-shadow layers, each
   offset by half a pixel and shaded a bit darker than the last,
   fake the "sides" of solid letters the way a 3D-modeled wordmark
   would look lit from the front. A slow rotateY gives it a real
   turntable feel (perspective is on the wrapper, so the rotation
   actually reads as depth, not just a squish). Sits large and
   faint behind the whole page as a brand watermark. */
.spsb-watermark-wrap{
  position: fixed;
  inset: 0;
  z-index: -1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  perspective: 1800px;
  pointer-events: none;
}
.spsb-watermark{
  font-family: 'Manrope', 'Segoe UI', sans-serif;
  font-weight: 900;
  letter-spacing: 0.04em;
  line-height: 1;
  color: #C08A2E;
  opacity: 0.16;
  -webkit-text-stroke: 1px rgba(255,255,255,0.25);
  transform-style: preserve-3d;
  animation: spsbTurntable 16s ease-in-out infinite;
  text-shadow:
    0.6px 0.6px 0 rgba(186,134,44,0.9),
    1.2px 1.2px 0 rgba(181,130,43,0.9),
    1.8px 1.8px 0 rgba(175,126,42,0.9),
    2.4px 2.4px 0 rgba(170,122,41,0.9),
    3.0px 3.0px 0 rgba(165,118,40,0.9),
    3.6px 3.6px 0 rgba(159,114,39,0.9),
    4.2px 4.2px 0 rgba(154,111,37,0.9),
    4.8px 4.8px 0 rgba(148,107,36,0.9),
    5.4px 5.4px 0 rgba(143,103,35,0.9),
    6.0px 6.0px 0 rgba(138,99,34,0.9),
    6.6px 6.6px 0 rgba(132,95,33,0.9),
    7.2px 7.2px 0 rgba(127,91,32,0.9),
    7.8px 7.8px 0 rgba(122,88,31,0.9),
    8.4px 8.4px 0 rgba(116,84,29,0.9),
    9.0px 9.0px 0 rgba(111,80,28,0.9),
    9.6px 9.6px 0 rgba(105,76,27,0.9),
    10.2px 10.2px 0 rgba(100,72,26,0.9),
    10.8px 10.8px 0 rgba(95,68,25,0.9),
    11.4px 11.4px 0 rgba(89,64,24,0.9),
    12.0px 12.0px 0 rgba(84,61,22,0.9),
    12.6px 12.6px 0 rgba(78,57,21,0.9),
    13.2px 13.2px 0 rgba(73,53,20,0.9),
    13.8px 13.8px 0 rgba(68,49,19,0.9),
    14.4px 14.4px 0 rgba(62,45,18,0.9),
    15.0px 15.0px 0 rgba(57,41,17,0.9),
    15.6px 15.6px 0 rgba(52,38,16,0.9);
  user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.wm-line{ display: block; }
.wm-team{ font-size: clamp(48px, 8vw, 130px); letter-spacing: 0.12em; margin-bottom: 0.05em; }
.wm-spsb{ font-size: clamp(140px, 26vw, 420px); }
@keyframes spsbTurntable{
  0%   { transform: rotateX(8deg) rotateY(-14deg); }
  50%  { transform: rotateX(8deg) rotateY(14deg); }
  100% { transform: rotateX(8deg) rotateY(-14deg); }
}
@media (prefers-reduced-motion: reduce){
  .spsb-watermark{ animation: none; transform: rotateX(8deg) rotateY(0deg); }
}
@media (max-width: 640px){
  .spsb-watermark{ opacity: 0.11; }
}

/* Cover text now sits BELOW the photo, in its own calm section */
.cover-text{
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 640px;
  margin: 0 auto;
  padding: 44px 24px 8px;
}
.cover-eyebrow{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--teal);
  background: var(--teal-soft);
  border: 1px solid rgba(14,128,116,0.3);
  padding: 7px 18px;
  border-radius: 999px;
  margin: 0 0 20px;
  box-shadow: 0 0 24px rgba(14,128,116,0.14);
}
.cover-title{
  font-family: 'Fraunces', serif;
  font-size: clamp(30px, 4.5vw, 44px);
  font-weight: 600;
  background: linear-gradient(120deg, var(--text) 40%, var(--teal) 70%, var(--text) 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin: 0 0 14px;
  letter-spacing: -0.01em;
  animation: shimmerTitle 8s ease-in-out infinite;
}
@keyframes shimmerTitle{
  0%, 100% { background-position: 0% center; }
  50% { background-position: 100% center; }
}
@media (prefers-reduced-motion: reduce){
  .cover-title{ animation: none; }
}
.cover-subtitle{
  color: var(--muted);
  font-size: 16px;
  line-height: 1.65;
  margin: 0;
}

/* Page header */
.page-head{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 0 40px;
  margin-bottom: 8px;
}
.page-head::after{
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(420px, 70%);
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--teal) 50%, transparent);
  opacity: 0.7;
}
.year-tabs{
  display: flex;
  gap: 4px;
  background: var(--bg-elev);
  border: 1px solid var(--card-border);
  border-radius: 999px;
  padding: 5px;
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.year-tabs::-webkit-scrollbar{ display: none; }
.year-tab{
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 700;
  background: none;
  border: none;
  color: var(--muted);
  padding: 9px 20px;
  border-radius: 999px;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
}
.year-tab:hover{ color: var(--text); }
.year-tab.active{
  background: linear-gradient(120deg, var(--teal), var(--teal-dark));
  color: #FFFFFF;
  box-shadow: 0 4px 16px rgba(14,128,116,0.32);
  animation: tabPulse 3s ease-in-out infinite;
}
@keyframes tabPulse{
  0%, 100% { box-shadow: 0 4px 16px rgba(14,128,116,0.32); }
  50% { box-shadow: 0 4px 24px rgba(14,128,116,0.48); }
}
@media (prefers-reduced-motion: reduce){
  .year-tab.active{ animation: none; }
}

/* Section heading */
.section-heading{
  display:flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 26px;
}
.section-heading .icon-chip{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  flex-shrink: 0;
}
.section-heading svg{ width: 22px; height: 22px; flex-shrink: 0; }
.section-heading h2{
  font-family: 'Fraunces', serif;
  font-size: 23px;
  font-weight: 600;
  margin: 0;
  color: var(--text);
}
.section-heading .count{
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  background: var(--bg-elev);
  border: 1px solid var(--card-border);
  padding: 3px 10px;
  border-radius: 999px;
}
.section-heading .rule{
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--card-border), transparent);
}
section.group{ margin-bottom: 56px; }
section.group:last-child{ margin-bottom: 0; }
section.group.fade-in{ animation: fadeUp 0.45s ease both; }

/* Single teal brand color throughout, matching the reference site */
.section-heading .icon-chip{ background: var(--teal-soft); border: 1px solid rgba(14,128,116,0.25); }
.section-heading svg{ color: var(--teal); }

.card[data-group] .card-name-row svg{ color: var(--teal); }
.card:hover{ border-color: rgba(14,128,116,0.35); }
.card .card-role{ color: var(--teal-dark); }

/* Grid */
.grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.grid.grid-compact{
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

/* Card — compact horizontal: photo on the right, name/role on the left */
.card{
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  height: 108px;
  background: var(--card-solid);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transform-style: preserve-3d;
  transition: border-color 0.2s ease, box-shadow 0.15s ease, transform 0.15s ease;
  will-change: transform;
}
.card:hover, .card:focus-visible{
  outline: none;
  box-shadow: var(--shadow-lg);
  transform: translateY(-3px);
}

/* 3D tilt glare — a soft light sweep that follows the cursor, driven by
   --tilt-mx/--tilt-my/--glare-opacity set from JS (see the tilt handler
   near the end of the script). Purely decorative; sits above the card's
   content but ignores clicks. */
.card::after{
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--tilt-mx, 50%) var(--tilt-my, 50%), rgba(255,255,255,0.5), transparent 55%);
  opacity: var(--glare-opacity, 0);
  transition: opacity 0.25s ease;
  pointer-events: none;
}

/* Row-rotation animation for the Volunteers & Mentors grid — driven from
   JS (rotateVolunteersRow) using the FLIP technique, so cards glide
   smoothly to their new grid position rather than fading in/out. The
   transform/transition are set inline per-card at animation time; no
   dedicated classes are needed here. */

/* Gentle glow pulse on the Volunteers & Mentors heading while it rotates,
   so the change reads as a deliberate flourish rather than a glitch. */
@keyframes headingShuffleGlow{
  0%, 100%{ text-shadow: none; }
  50%{ text-shadow: 0 0 14px rgba(20,166,150,0.45); }
}
.section-heading.volunteers.is-shuffling h2{ animation: headingShuffleGlow 0.9s ease; }

.card-info{
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  flex: 1;
}
.card-name-row{
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
.card-name-row svg{ width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
.card-name{
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.card-role{
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--muted);
}

/* Photo box: size/margin/padding all come from the tokens in :root —
   see "PHOTO TOKENS" above. Nothing here is a hardcoded number. */
.card-photo{
  flex-shrink: 0;
  width: var(--photo-size);
  align-self: stretch;
  margin: var(--photo-margin);
  padding: var(--photo-padding);
  overflow: hidden; /* clips the zoomed image at this box's edge */
  position: relative;
}
.card-photo img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 15%; /* keeps the face in frame instead of a plain center crop */
  display: block;
  border-radius: var(--photo-radius);
  transform: scale(var(--photo-zoom)); /* crops out white/blank borders baked into the source photo */
  transform-origin: center;
}

/* Compact volunteer cards: only the photo width token changes */
.grid-compact .card-photo{ width: var(--photo-size-compact); }
.grid-compact .card-info{ padding: 14px 12px; }
.grid-compact .card-name{ font-size: 13.5px; }
.grid-compact .card-role{ font-size: 10.5px; }

@keyframes fadeUp{
  from{ opacity: 0; transform: translateY(8px); }
  to{ opacity: 1; transform: translateY(0); }
}

/* ---------- Modal ---------- */
.modal-overlay{
  position: fixed; inset: 0;
  background: rgba(10,14,13,0.55);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open{ opacity: 1; pointer-events: auto; }

.modal{
  background: var(--card-solid);
  border: 1px solid var(--card-border);
  border-radius: 22px;
  max-width: 420px;
  width: 100%;
  max-height: 84vh;
  overflow-y: auto;
  box-shadow: 0 30px 70px rgba(15,40,37,0.22), 0 4px 16px rgba(15,40,37,0.10);
  transform: translateY(18px) scale(0.97);
  transition: transform 0.28s cubic-bezier(.2,.8,.2,1), opacity 0.25s ease;
}
.modal-overlay.open .modal{ transform: translateY(0) scale(1); }

.modal-photo-banner{
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 320px;
  overflow: hidden;
  position: relative;
  background: var(--bg-elev);
  border-radius: 22px 22px 0 0;
}
.modal-photo-banner img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: none !important; /* guards against any inherited rotate/flip from outside CSS */
}
.modal-photo-banner::after{
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(15,23,42,0.06) 100%);
  pointer-events: none;
}

.modal-close{
  position: absolute;
  top: 16px; right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.92);
  box-shadow: 0 2px 8px rgba(15,23,42,0.15);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  z-index: 2;
  display:flex; align-items:center; justify-content:center;
  transition: color 0.15s ease, transform 0.15s ease;
}
.modal-close:hover{ color: var(--teal); transform: rotate(90deg); }

.modal-share{
  position: absolute;
  top: 16px; left: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.92);
  box-shadow: 0 2px 8px rgba(15,23,42,0.15);
  color: var(--text);
  cursor: pointer;
  z-index: 2;
  display:flex; align-items:center; justify-content:center;
  transition: color 0.15s ease, transform 0.15s ease;
}
.modal-share svg{ width: 16px; height: 16px; }
.modal-share:hover{ color: var(--teal); transform: scale(1.08); }
.modal-share.copied{ color: var(--teal); }

.modal-head{
  padding: 22px 28px 24px;
  text-align: center;
  position: relative;
  background: var(--card-solid);
  border-bottom: 1px solid var(--card-border);
}

.modal-head h3{
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 10px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.modal-head .current-role{
  display: inline-block;
  font-family: 'Manrope', sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--teal-dark);
  background: var(--teal-soft);
  border: 1px solid rgba(184,134,11,0.18);
  padding: 5px 13px;
  border-radius: 999px;
  margin: 0;
}
/* Info cards — a stack of individually elevated cards (not one merged
   panel with divider lines), so university, phone, email and address
   each read as their own attractive card. Each gets a distinct icon
   color from the site's brand palette, and lifts slightly on hover like
   the member cards do. */
.modal-info-card{
  margin: 16px auto 0;
  max-width: 320px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.modal-info-card .info-row{
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--card-solid);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.modal-info-card .info-row:hover{
  transform: translateX(3px);
  box-shadow: var(--shadow-lg);
}
.modal-info-card .info-row:empty,
.modal-info-card .info-row[hidden]{ display: none; }
.modal-info-card .info-icon{
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--info-accent-soft, var(--teal-soft));
  color: var(--info-accent, var(--teal-dark));
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-info-card .info-icon svg{ width: 14px; height: 14px; }
.modal-info-card .info-text{
  font-family: 'Manrope', sans-serif;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.5;
  padding-top: 5px;
  word-break: break-word;
}
.modal-info-card .info-text a{
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dashed var(--violet);
}
.modal-info-card .info-text a:hover{
  color: var(--violet);
  border-bottom-style: solid;
}
#rowInstitution{ --info-accent: var(--teal-dark); --info-accent-soft: var(--teal-soft); }
#rowPhone{ --info-accent: var(--gold); --info-accent-soft: var(--gold-soft); }
#rowEmail{ --info-accent: var(--violet); --info-accent-soft: var(--violet-soft); }
#rowAddress{ --info-accent: var(--rose); --info-accent-soft: var(--rose-soft); }

.modal-body{ padding: 26px 28px 32px; }
.modal-body h4{
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 20px;
}
.modal-body h4::after{
  content: "";
  flex: 1;
  height: 1px;
  background: var(--card-border);
}

.timeline{ position: relative; padding-left: 26px; }
.timeline::before{
  content:"";
  position:absolute; left: 9px; top: 4px; bottom: 4px;
  width: 2px;
  background: linear-gradient(180deg, var(--teal), var(--teal-dark));
  opacity: 0.3;
  border-radius: 2px;
}
.t-item{ position: relative; padding-bottom: 14px; }
.t-item:last-child{ padding-bottom: 0; }
.t-item::before{
  content:"";
  position:absolute; left: -25px; top: 14px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--card-solid);
  border: 2.5px solid var(--teal);
  box-shadow: 0 0 0 4px var(--bg);
  z-index: 1;
}
.t-item.current::before{
  background: var(--teal);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--teal-soft);
}

/* Plain stacked text per entry — no card/box around it. Year and group
   label still pick up the group's accent color (teal / gold / violet,
   set via --t-accent from JS) so entries stay visually distinguishable
   without being boxed. */
.t-card{ display: block; }
.t-year-badge{
  display: block;
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--t-accent, var(--text));
  margin: 0 0 2px;
}
.t-card-text{ min-width: 0; }
.t-role{ font-family: 'Fraunces', serif; font-size: 14px; color: var(--text); margin: 0 0 2px; }
.t-group{ font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 700; color: var(--t-accent, var(--teal-dark)); text-transform: uppercase; letter-spacing: 0.04em; }

@media (max-width: 900px){
  .grid{ grid-template-columns: repeat(2, 1fr); }
  .grid.grid-compact{ grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px){
  :root{ --photo-size: 112px; }
  .wrap{ padding: 0 18px 24px; }
  .grid, .grid.grid-compact{ grid-template-columns: 1fr; gap: 14px; }
  .page-head{ padding: 20px 0 32px; }
  .year-tabs{ width: 100%; }
  .card-info{ padding: 16px 14px; }
  .modal-head{ padding: 26px 20px 18px; }
  .modal-body{ padding: 20px 20px 26px; }
}
@media (max-width: 380px){
  :root{ --photo-size: 92px; --photo-size-compact: 76px; }
  .card{ height: 118px; }
  .card-name{ font-size: 14px; }
  .card-role{ font-size: 10px; }
  .modal{ max-width: 100%; }
  .modal-photo-banner{ max-height: 260px; }
}
@media (prefers-reduced-motion: reduce){
  .card, .year-tab, .modal, .modal-overlay{ transition: none; animation: none; }
  .section-heading.volunteers.is-shuffling h2{ animation: none; }
  .card::after{ display: none; }
  .marquee-track{ animation: none; }
}

/* ---------- Our Golden Memory — scrolling photo strip ---------- */
.golden-memory{
  padding: 24px 0 68px;
  text-align: center;
  overflow: hidden;
}
.golden-eyebrow{
  color: var(--gold);
  background: var(--gold-soft);
  border: 1px solid rgba(192,138,46,0.35);
  box-shadow: 0 0 24px rgba(192,138,46,0.16);
}
.golden-memory-label{
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 30px;
}
.marquee-wrap{
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
.marquee-track{
  display: flex;
  align-items: center;
  gap: 0;
  width: max-content;
  animation: marqueeMove 230s linear infinite;
}
.marquee-track img{
  width: 360px;
  height: 245px;
  object-fit: cover;
  background: var(--card-solid);
  flex-shrink: 0;
}
/* Moving left to right: the track starts shifted left by exactly one
   full copy's width (-50% of the doubled track) and animates back to
   0 — since the image list is duplicated below, this loops seamlessly
   with no visible jump. */
@keyframes marqueeMove{
  from{ transform: translateX(-50%); }
  to{ transform: translateX(0); }
}

</style>

<script>
/* ---------------------------------------------------------------
     Replace the PEOPLE array with your real club data.
     - `phone`: their phone number (any format — digits are matched
        after stripping spaces/dashes). This is the safest way to
        identify "is this the same person as last year?" since two
        different people can share a name, but not a phone number.
        If two entries anywhere in this file have the same phone
        number, they're automatically merged into ONE person with a
        combined multi-year history — even if you used different
        ids or slightly different name spelling for each entry.
     - `photo`: URL to their photo (upload to your WordPress Media
        Library and paste the image URL here).
     - `history`: every year + role + group this person has held.
        Year tabs and the "full history" modal are generated from
        this automatically.
  ----------------------------------------------------------------*/
  const YEAR_RANGE = { start: 2015, end: 2026 }; // shows tabs for every year in this range

  const PEOPLE = [];
  const PHONE_INDEX = {}; // normalized phone -> person id, used to auto-merge duplicates

  function normalizePhone(phone){
    if(!phone) return null;
    const digits = String(phone).replace(/[^0-9]/g, '');
    return digits.length ? digits : null;
  }

  // Generates a colored initials avatar entirely locally (no network
  // request) — this is what fixes broken/slow-loading photos. Real
  // people without an uploaded photo yet get one of these instead of
  // depending on an external image service, which can be slow, get
  // blocked, or fail on the live site.
  const AVATAR_COLORS = ['D4AF37', 'A78BFA', '34D399', 'E08E45', '6FA8DC'];
  function localAvatar(name, seed){
    const initials = name.trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
    const color = AVATAR_COLORS[seed % AVATAR_COLORS.length];
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#${color}'/><text x='50' y='58' font-family='Manrope,Arial,sans-serif' font-size='36' font-weight='700' fill='#0B0A12' text-anchor='middle'>${initials}</text></svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }
  window.__avatarFallback = localAvatar;

  // Adds one history entry to a person, creating their record on first use.
  // If `phone` matches a phone already seen elsewhere, this reuses THAT
  // person's record instead of `id` — so the same real person's history
  // stays linked together even if entered under a different id/list.
  function upsertPerson(id, name, photo, entry, phone, institution, department){
    const normPhone = normalizePhone(phone);
    if(normPhone && PHONE_INDEX[normPhone]){
      id = PHONE_INDEX[normPhone];
    }
    let existing = PEOPLE.find(p => p.id === id);
    if(!existing){
      const seed = PEOPLE.length;
      const resolvedPhoto = photo || localAvatar(name, seed);
      existing = { id, name, photo: resolvedPhoto, avatarSeed: seed, phone: phone || null, institution: institution || null, department: department || null, history: [] };
      PEOPLE.push(existing);
    } else {
      if(phone && !existing.phone) existing.phone = phone;
      if(institution && !existing.institution) existing.institution = institution;
      if(department && !existing.department) existing.department = department;
      // A real photo arriving later (e.g. added after the person already
      // exists from an earlier year) replaces the local placeholder avatar.
      if(photo && existing.photo && existing.photo.startsWith('data:image/svg')){
        existing.photo = photo;
      }
    }
    if(normPhone) PHONE_INDEX[normPhone] = existing.id;
    existing.history.push(entry);
    return existing;
  }

  // Sets contact info on an already-created person without adding a new
  // history entry — for people whose phone/university arrived separately
  // from their role data (e.g. a contact list for people already entered
  // above as coordinators/leaders).
  function setContactInfo(id, phone, institution){
    const person = PEOPLE.find(x => x.id === id);
    if(!person) return;
    const normPhone = normalizePhone(phone);
    if(phone){ person.phone = phone; if(normPhone) PHONE_INDEX[normPhone] = person.id; }
    if(institution) person.institution = institution;
  }

  // Sets a person's department/major, independent of their institution —
  // for cases where department info arrives from a different source
  // (e.g. an application form) than the phone/university did.
  function setDepartment(id, department){
    const person = PEOPLE.find(x => x.id === id);
    if(!person || !department) return;
    person.department = department;
  }

  // Fixes a name's spelling/capitalization on an existing record (e.g.
  // "farzana akter lima" -> "Farzana Akter Lima") without touching
  // anything else about that person.
  function renamePerson(id, correctedName){
    const person = PEOPLE.find(x => x.id === id);
    if(!person || !correctedName) return;
    person.name = correctedName;
  }

  // Sets email / present address / permanent address on an already-created
  // person, without touching their history — same pattern as
  // setContactInfo/setDepartment, for info that arrives from a separate
  // source (here: the full volunteer application export).
  function setPersonalInfo(id, email, presentAddress, permanentAddress){
    const person = PEOPLE.find(x => x.id === id);
    if(!person) return;
    if(email) person.email = email;
    if(presentAddress) person.presentAddress = presentAddress;
    if(permanentAddress) person.permanentAddress = permanentAddress;
  }

  // Updates an existing history entry for a given year (e.g. promoting
  // someone from "Volunteer" to "Core Volunteer" for a year they already
  // have on record) instead of pushing a second, duplicate entry for
  // that same year.
  function setRoleForYear(id, year, role, group){
    const person = PEOPLE.find(x => x.id === id);
    if(!person) return;
    const entry = person.history.find(h => h.year === year);
    if(entry){
      entry.role = role;
      if(group) entry.group = group;
    }
  }

  // Removes a single year's entry from a person's history (e.g. they
  // shouldn't be shown for a year they were previously added to).
  function removeYearEntry(id, year){
    const person = PEOPLE.find(x => x.id === id);
    if(!person) return;
    person.history = person.history.filter(h => h.year !== year);
  }

  // Sets a real photo on an already-created person, without touching their
  // history. Pass a direct image URL (e.g. a WordPress Media Library URL,
  // or a Google Drive "uc?export=view&id=..." link for a file shared as
  // "Anyone with the link can view"). Drive links can be unreliable for
  // hotlinking — the onerror handler on each <img> falls back to the
  // local initials avatar automatically if this fails to load.
  function setPhoto(id, url){
    const person = PEOPLE.find(x => x.id === id);
    if(!person || !url) return;
    person.photo = url;
  }

  // Merges two person records that turned out to be the same real person
  // (e.g. their name was entered separately in two different years' lists
  // with no phone number to auto-link them). Keeps `keepId`'s record,
  // moves any history years `removeId` has that `keepId` doesn't, then
  // removes the now-redundant duplicate entirely.
  function mergeDuplicate(keepId, removeId){
    const keep = PEOPLE.find(p => p.id === keepId);
    const remove = PEOPLE.find(p => p.id === removeId);
    if(!keep || !remove) return;
    remove.history.forEach(h => {
      if(!keep.history.some(kh => kh.year === h.year)) keep.history.push(h);
    });
    if(!keep.phone && remove.phone) keep.phone = remove.phone;
    if(!keep.institution && remove.institution) keep.institution = remove.institution;
    const idx = PEOPLE.indexOf(remove);
    if(idx !== -1) PEOPLE.splice(idx, 1);
  }

  // Cover photo rotates automatically — a new photo fades in every 3

  const COVER_PHOTOS = [
    "https://drive.google.com/thumbnail?id=1nsmMPMA56WkbkN8lyldkj4rju1EU2rp6&sz=w1600",

  // Farseem Mannan Mohammady — VP of SPSB & Country Coordinator of bdjso,

  // NOTE: "MD MURSALINE PARVEZ" was given phone 01799396584 in the same

  let currentYear = null;

  function renderYear(year){
    year = Number(year);
    currentYear = year;
    const content = document.getElementById('content');
    let html = "";

    GROUP_ORDER.forEach(group => {
      let members = PEOPLE
        .map(p => ({ p, entry: p.history.find(h => h.year === year && h.group === group) }))
        .filter(x => x.entry);

      const orderMap = group === 'core_team' ? CORE_TEAM_ORDER : (group === 'volunteers' ? VOLUNTEER_ORDER : null);
      if(orderMap && orderMap[year]){
        const order = orderMap[year];
        members.sort((a, b) => {
          const ia = order.indexOf(a.p.id), ib = order.indexOf(b.p.id);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });
      }

      if(members.length){
        const gridClass = 'grid';
        const gridId = group === 'volunteers' ? ' id="volunteersGrid"' : '';
        html += `
          <section class="group fade-in">
            <div class="section-heading ${group}">${ICONS[GROUP_ICON[group]]}<h2>${GROUP_LABELS[group]}</h2><span class="count">${members.length}</span><div class="rule"></div></div>
            <div class="${gridClass}"${gridId}>
              ${members.map(({p, entry}, i) => card(p, entry, i)).join("")}
            </div>
          </section>`;
      }
    });

    content.innerHTML = html || `<p style="color:var(--muted);">No records for ${year}.</p>`;

    content.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => openModal(el.dataset.id));
      el.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(el.dataset.id); }
      });
    });
  }

  function shuffleArray(arr){
    // Fisher–Yates — kept as a small utility; not used by the row-rotation
    // animation below, but harmless to have around if a plain shuffle is
    // ever wanted elsewhere.
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Cascading row swap for the Volunteers & Mentors grid, every 10
  // seconds: row 1 and row 2 swap places first; 1 second later, whichever
  // row now holds the original row-1 cards swaps down into row 3's spot
  // (so row 3 moves up to 2nd place); another second later it swaps into
  // row 4's spot, and so on — one swap per second — until the original
  // row 1 has bubbled all the way down to the last row. Only the
  // Volunteers & Mentors grid is touched; Secretariat and Organizing
  // Secretary are untouched, and PEOPLE/VOLUNTEER_ORDER are never
  // modified — this is purely a display-order animation.
  function applyRowOrderWithFlip(grid, newIds){
    const cardsBefore = Array.from(grid.querySelectorAll('.card'));
    const rectsBefore = new Map();
    cardsBefore.forEach(el => rectsBefore.set(el.dataset.id, el.getBoundingClientRect()));

    const byId = new Map();
    PEOPLE.forEach(p => {
      const entry = p.history.find(h => h.year === currentYear && h.group === 'volunteers');
      if(entry) byId.set(p.id, { p, entry });
    });

    grid.innerHTML = newIds.map((id, i) => {
      const { p, entry } = byId.get(id);
      return card(p, entry, i);
    }).join("");

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cardsAfter = Array.from(grid.querySelectorAll('.card'));
    cardsAfter.forEach(el => {
      el.addEventListener('click', () => openModal(el.dataset.id));
      el.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(el.dataset.id); }
      });
      if(reduceMotion) return;
      const first = rectsBefore.get(el.dataset.id);
      if(!first) return;
      const last = el.getBoundingClientRect();
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      if(dx === 0 && dy === 0) return;
      el.style.transition = 'none';
      el.style.transform = `translate(${dx}px, ${dy}px)`;
    });
    if(reduceMotion) return;
    void grid.offsetHeight;
    cardsAfter.forEach(el => {
      el.style.transition = 'transform 0.6s cubic-bezier(.4,0,.2,1)';
      el.style.transform = '';
      el.addEventListener('transitionend', () => { el.style.transition = ''; }, { once: true });
    });
  }

  function cascadeRotateVolunteers(){
    const yearAtStart = currentYear;
    if(yearAtStart === null){ setTimeout(cascadeRotateVolunteers, 5000); return; }
    const grid = document.getElementById('volunteersGrid');
    if(!grid){ setTimeout(cascadeRotateVolunteers, 5000); return; }

    const colCount = getComputedStyle(grid).gridTemplateColumns.split(' ').length || 3;
    let idsInOrder = Array.from(grid.querySelectorAll('.card')).map(el => el.dataset.id);
    const totalRows = Math.ceil(idsInOrder.length / colCount);
    if(totalRows < 2){ setTimeout(cascadeRotateVolunteers, 5000); return; }

    const heading = document.querySelector('.section-heading.volunteers');
    const pulseHeading = () => {
      if(!heading) return;
      heading.classList.add('is-shuffling');
      setTimeout(() => heading.classList.remove('is-shuffling'), 900);
    };

    function swapRows(rowA, rowB){
      const startA = rowA * colCount, endA = Math.min(startA + colCount, idsInOrder.length);
      const startB = rowB * colCount, endB = Math.min(startB + colCount, idsInOrder.length);
      const rowAIds = idsInOrder.slice(startA, endA);
      const rowBIds = idsInOrder.slice(startB, endB);
      const next = idsInOrder.slice();
      for(let i = 0; i < rowBIds.length; i++) next[startA + i] = rowBIds[i];
      for(let i = 0; i < rowAIds.length; i++) next[startB + i] = rowAIds[i];
      idsInOrder = next;
    }

    // travelingRow = which row currently holds the original row-1 cards.
    let travelingRow = 0;
    function stepDown(){
      // Bail out cleanly if the person switched year tabs mid-cascade —
      // the grid has since been rebuilt for a different year.
      if(currentYear !== yearAtStart) return;
      const liveGrid = document.getElementById('volunteersGrid');
      if(!liveGrid){ setTimeout(cascadeRotateVolunteers, 5000); return; }

      if(travelingRow >= totalRows - 1){
        setTimeout(cascadeRotateVolunteers, 5000); // reached the bottom — pause, then start again
        return;
      }

      swapRows(travelingRow, travelingRow + 1);
      travelingRow++;
      pulseHeading();
      applyRowOrderWithFlip(liveGrid, idsInOrder);
      setTimeout(stepDown, 1000);
    }
    stepDown();
  }
  setTimeout(cascadeRotateVolunteers, 5000);

  // 3D tilt-on-hover for every card, everywhere on the site (Secretariat,
  // Organizing Secretary, Volunteers & Mentors — all years). The card
  // rotates in perspective to follow the cursor, with a light-glare sweep
  // (the .card::after radial gradient) and a shadow that shifts with the
  // tilt for a sense of real depth. Delegated on `document` rather than
  // attached per-card, so it keeps working automatically after any
  // re-render (switching years, the Volunteers row-swap animation) —
  // nothing needs to be reattached.
  const tiltEnabled = window.matchMedia
    && window.matchMedia('(hover: hover) and (pointer: fine)').matches
    && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(tiltEnabled){
    const TILT_MAX = 10; // degrees
    let activeTiltCard = null;

    function resetTilt(el){
      el.style.transform = '';
      el.style.boxShadow = '';
      el.style.setProperty('--glare-opacity', '0');
    }

    document.addEventListener('mousemove', (e) => {
      const card = e.target.closest && e.target.closest('.card');

      if(activeTiltCard && activeTiltCard !== card){
        resetTilt(activeTiltCard);
        activeTiltCard = null;
      }
      if(!card) return;
      activeTiltCard = card;

      const rect = card.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      const rotateY = (px - 0.5) * TILT_MAX * 2;
      const rotateX = -(py - 0.5) * TILT_MAX * 2;

      card.style.transform = `perspective(700px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-3px)`;
      card.style.setProperty('--tilt-mx', `${px * 100}%`);
      card.style.setProperty('--tilt-my', `${py * 100}%`);
      card.style.setProperty('--glare-opacity', '1');

      // Shadow leans away from the tilt direction, like light is hitting
      // the raised edge of the card.
      const shadowX = -rotateY * 1.1;
      const shadowY = rotateX * 1.1 + 10;
      card.style.boxShadow = `${shadowX}px ${shadowY}px 28px rgba(10,60,55,0.18)`;
    });

    // mousemove stops firing once the cursor leaves the window entirely —
    // make sure a tilted card doesn't get stuck mid-tilt in that case.
    document.addEventListener('mouseleave', () => {
      if(activeTiltCard){ resetTilt(activeTiltCard); activeTiltCard = null; }
    });
  }

  function renderTabs(){
    const years = [];
    for(let y = YEAR_RANGE.end; y >= YEAR_RANGE.start; y--) years.push(y);
    const tabWrap = document.getElementById('yearTabs');
    tabWrap.innerHTML = years.map((y, i) =>
      `<button class="year-tab${i===0 ? ' active' : ''}" data-year="${y}">${y}</button>`
    ).join("");

    tabWrap.querySelectorAll('.year-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        tabWrap.querySelectorAll('.year-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderYear(btn.dataset.year);
      });
    });

    renderYear(years[0]);
  }

  let currentModalPerson = null;
  function openModal(id){
    const overlay = document.getElementById('modalOverlay');
    const p = PEOPLE.find(x => x.id === id);
    if(!p || !overlay) return;
    currentModalPerson = p;
    const hist = sortedHistory(p);

    const modalAvatarEl = document.getElementById('modalAvatar');
    modalAvatarEl.onerror = () => { modalAvatarEl.onerror = null; modalAvatarEl.src = localAvatar(p.name, p.avatarSeed); };
    modalAvatarEl.src = p.photo;
    modalAvatarEl.alt = p.name;
    document.getElementById('modalName').textContent = p.name;
    document.getElementById('modalCurrentRole').textContent = `${hist[0].role} · ${hist[0].year}`;

    // Fills one info-row: icon chip (SVG) + text, hiding the entire row
    // (not just the text) when there's nothing to show.
    function fillInfoRow(rowId, textId, iconSvg, text, href){
      const row = document.getElementById(rowId);
      const textEl = document.getElementById(textId);
      if(text){
        row.querySelector('.info-icon').innerHTML = iconSvg;
        if(href){
          textEl.innerHTML = `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
        } else {
          textEl.textContent = text;
        }
        row.hidden = false;
      } else {
        row.hidden = true;
      }
    }

    const instText = [p.institution, p.department].filter(Boolean).join(" — ");
    fillInfoRow('rowInstitution', 'modalInstitution', ICONS.cap, instText);

    // Displayed phone hides the last 3 digits (e.g. 01309451***) — the
    // full number stays stored on the person record since it's still
    // needed internally to auto-merge duplicate entries by phone.
    function maskPhone(phone){
      const digits = String(phone).replace(/[^0-9]/g, '');
      if(digits.length <= 3) return phone;
      return digits.slice(0, -3) + "***";
    }
    fillInfoRow('rowPhone', 'modalPhone', ICONS.phone, p.phone ? maskPhone(p.phone) : "");

    // Clicking the email opens Gmail's compose view directly (in a new
    // tab), addressed to this person, rather than just showing plain text.
    const gmailComposeUrl = p.email
      ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(p.email)}`
      : null;
    fillInfoRow('rowEmail', 'modalEmail', ICONS.mail, p.email || "", gmailComposeUrl);

    // Addresses are stored as full free-text (street, area, postal code)
    // but only the district name is shown here — prefer an explicit
    // "District: X" label if the stored text has one, otherwise fall
    // back to the last comma-separated segment (usually the district/
    // city), with any trailing postal code stripped.
    function districtOnly(address){
      if(!address) return "";
      const explicit = address.match(/Dis(?:trict)?:\s*([^,]+)/i);
      if(explicit) return explicit[1].trim().replace(/\.$/, '');
      const parts = address.split(',').map(s => s.trim()).filter(Boolean);
      let last = parts[parts.length - 1] || address.trim();
      last = last.replace(/-?\s*\d{3,4}$/, '').replace(/\.$/, '').trim();
      return last;
    }
    const presentDistrict = districtOnly(p.presentAddress);
    const permanentDistrict = districtOnly(p.permanentAddress);
    const addressText = presentDistrict
      ? `${presentDistrict}${permanentDistrict && permanentDistrict !== presentDistrict ? ` (Permanent: ${permanentDistrict})` : ""}`
      : (permanentDistrict || "");
    fillInfoRow('rowAddress', 'modalAddress', ICONS.pin, addressText);

    const yearsWorked = hist.length;
    document.querySelector('.modal-body h4').textContent =
      `Full history — ${yearsWorked} year${yearsWorked > 1 ? 's' : ''}`;

    // Group-colored accent for each timeline card — reuses the site's
    // existing teal/gold/violet brand palette so Secretariat, Organizing
    // Secretary, and Volunteers & Mentors entries are visually distinct
    // at a glance, without needing separate icons per row.
    const GROUP_ACCENT = {
      coordinators: ['var(--teal)', 'var(--teal-soft)'],
      core_team: ['var(--gold)', 'var(--gold-soft)'],
      volunteers: ['var(--violet)', 'var(--violet-soft)']
    };

    document.getElementById('modalTimeline').innerHTML = hist.map((h, i) => {
      const [accent, accentSoft] = GROUP_ACCENT[h.group] || GROUP_ACCENT.coordinators;
      return `
      <div class="t-item${i===0 ? ' current' : ''}">
        <div class="t-card" style="--t-accent:${accent};--t-accent-soft:${accentSoft};">
          <span class="t-year-badge">${h.year}</span>
          <div class="t-card-text">
            <p class="t-role">${h.role}</p>
            <p class="t-group">${GROUP_LABELS[h.group]}</p>
          </div>
        </div>
      </div>
    `;
    }).join("");

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  // Opens a print-ready ID card (front + back) for one person in a new
  // window/tab, styled with the site's brand palette. Uses plain <img>
  // tags rather than a canvas — canvas-based PNG export would silently
  // break for any photo whose host (Google Drive, in our case) doesn't
  // send permissive CORS headers, since reading pixel data from a
  // cross-origin image taints the canvas. Printing/"Save as PDF" via the
  // browser works reliably for every photo regardless of that, since
  // displaying an image never requires CORS — only extracting its pixels
  // does.
  function closeModal(){
    const overlay = document.getElementById('modalOverlay');
    if(!overlay) return;
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
